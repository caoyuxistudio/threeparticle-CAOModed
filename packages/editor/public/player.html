<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Player</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Opaque, not translucent. With black-translucent, iOS 26 lays the web view
      out from the very top of the screen but sizes it as if it began below the
      status bar — the page overlaps the status bar and a status-bar-high strip
      at the bottom belongs to nobody (measured: screen 956, page 894, top inset
      62). Opaque black puts the page below the bar at exactly the height it
      was given, and on a black page the bar is invisible anyway.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Player" />
    <link rel="apple-touch-icon" href="./favicon/apple-touch-icon.png" />
    <link rel="icon" href="./favicon/favicon.ico" />
    <style>
      /*
        The canvas is sized to the output camera's frame and centred; the bars
        around it are this background showing through. Letterboxing this way
        rather than with a scissor rectangle is deliberate — post processing
        cannot be scissored without taking its own scene pass down with it.
      */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* No double-tap zoom on a phone; a tap is a control here. */
        touch-action: manipulation;
      }

      .player-fullscreen {
        position: fixed;
        right: calc(16px + env(safe-area-inset-right));
        bottom: calc(16px + env(safe-area-inset-bottom));
        padding: 12px 18px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 500 15px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }

      .player-fullscreen.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .player-perf {
        bottom: calc(72px + env(safe-area-inset-bottom));
      }

      #player-stage {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #player-stage canvas {
        display: block;
      }

      .player-status {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #777;
        font: 400 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.3px;
        text-align: center;
        pointer-events: none;
      }
    </style>
    <script defer src="./build/player.js"></script>
  </head>
  <body>
    <div id="player-stage"></div>
    <div class="player-status"></div>
  </body>
</html>
