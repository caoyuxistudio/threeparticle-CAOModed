<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Player</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Kept at the piece's top-edge colour while it plays (world.ts): the bars a phone keeps take this colour. -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      "default": the page sits below the status bar and the bar takes the
      page's theme-color — which world.ts keeps at the colour of the piece's
      top edge while it plays, so the bar reads as the picture continuing.
      iOS 27 beta gives a Home Screen web app a view the screen minus the
      status bar whatever the style (measured 894 of 956, on the manifest
      path and the legacy one alike); translucent only moves that view up
      under the bar and leaves the strip at the bottom, where nothing can
      tint it. Below the bar, tinted, is the best an iPhone web page can do.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Player" />
    <link rel="apple-touch-icon" href="./favicon/apple-touch-icon.png" />
    <link rel="icon" href="./favicon/favicon.ico" />
    <style>
      /*
        The canvas is sized to the output camera's frame and centred; the bars
        around it are this background showing through. Letterboxing this way
        rather than with a scissor rectangle is deliberate — post processing
        cannot be scissored without taking its own scene pass down with it.
      */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* No double-tap zoom on a phone; a tap is a control here. */
        touch-action: manipulation;
      }

      .player-fullscreen {
        position: fixed;
        right: calc(16px + env(safe-area-inset-right));
        bottom: calc(16px + env(safe-area-inset-bottom) - var(--viewport-gap, 0px));
        padding: 12px 18px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 500 15px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }

      .player-fullscreen.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .player-perf {
        bottom: calc(72px + env(safe-area-inset-bottom) - var(--viewport-gap, 0px));
      }

      #player-stage {
        position: relative;
        top: calc(-1 * var(--viewport-top-gap, 0px));
        width: 100%;
        height: calc(100% + var(--viewport-top-gap, 0px) + var(--viewport-gap, 0px));
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #player-stage canvas {
        display: block;
      }

      .player-status {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #777;
        font: 400 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.3px;
        text-align: center;
        pointer-events: none;
      }
    </style>
    <script defer src="./build/player.js"></script>
  </head>
  <body>
    <div id="player-stage"></div>
    <div class="player-status"></div>
  </body>
</html>
